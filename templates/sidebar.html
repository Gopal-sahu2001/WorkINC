<!-- =============================================
     WORKinc — Sidebar Partial
     {% include 'partials/sidebar.html' %}
     ============================================= -->
<aside class="sidebar" id="sidebar">

  <div class="sidebar-header">
    <a href="/dashboard" class="sidebar-logo">WORK<span>inc</span></a>
    <div class="sidebar-user">
      <div class="user-avatar">{{ current_user.name[0] | upper if current_user else 'U' }}</div>
      <div class="user-name">{{ current_user.name if current_user else 'Guest' }}</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a href="/dashboard"  class="nav-item" data-page="dashboard">
      <span class="nav-icon">▦</span> Dashboard
    </a>
    <a href="/autopay"    class="nav-item" data-page="autopay">
      <span class="nav-icon">↻</span> Auto-pay
      {% if pending_count %}<span class="nav-badge">{{ pending_count }}</span>{% endif %}
    </a>
    <a href="/schedule"   class="nav-item" data-page="schedule">
      <span class="nav-icon">▤</span> Schedule
    </a>
    <a href="/analytics"  class="nav-item" data-page="analytics">
      <span class="nav-icon">↗</span> Analytics
    </a>
    <a href="/settings"   class="nav-item" data-page="settings">
      <span class="nav-icon">⚙</span> Settings
    </a>
  </nav>

  <div class="sidebar-footer">
    <a href="/logout" class="nav-item">
      <span class="nav-icon">⎋</span> Sign out
    </a>
  </div>

</aside>
